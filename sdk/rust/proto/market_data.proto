syntax = "proto3";

package market_data;

message MarketDataPacket {
  string symbol = 1;
  double price = 2;
  double quantity = 3;
  int64 timestamp = 4; // Unix timestamp in milliseconds
  bool is_snapshot = 5;
  uint64 sequence_id = 6;
  int64 time_exchange = 7; // Microseconds
  int64 time_ingest = 8;   // Microseconds
}
