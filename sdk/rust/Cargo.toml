[package]
name = "torii-client"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"
url = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.12"
log = "0.4"
env_logger = "0.10"

[build-dependencies]
prost-build = "0.12"

[dev-dependencies]
anyhow = "1.0"
