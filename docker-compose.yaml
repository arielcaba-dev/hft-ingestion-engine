version: "3.9"

services:
  # --------------------------------------------------------------------------
  # REDPANDA (Kafka Broker)
  # --------------------------------------------------------------------------
  redpanda:
    image: redpandadata/redpanda:v23.3.1
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:${REDPANDA_PORT}
      - --advertise-kafka-addr internal://redpanda:9092,external://${PUBLIC_HOST}:${REDPANDA_PORT}
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:${REDPANDA_SCHEMA_REGISTRY_PORT}
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
    ports:
      - "${REDPANDA_PORT}:${REDPANDA_PORT}"
      - "${REDPANDA_SCHEMA_REGISTRY_PORT}:${REDPANDA_SCHEMA_REGISTRY_PORT}"
      - "${REDPANDA_ADMIN_PORT}:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - crypto_net
    healthcheck:
      test: [ "CMD-SHELL", "rpk cluster health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # --------------------------------------------------------------------------
  # REDPANDA INIT (Topic Creation)
  # --------------------------------------------------------------------------
  init-redpanda:
    image: redpandadata/redpanda:v23.3.1
    container_name: init-redpanda
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "echo 'Waiting for Redpanda...'; sleep 5; rpk topic create market_data_raw -r 1 -p 4 --brokers redpanda:9092; rpk topic create ohlcv_1m -r 1 -p 1 --brokers redpanda:9092; rpk topic create metrics_derived -r 1 -p 1 --brokers redpanda:9092; echo 'Topics created';"
    networks:
      - crypto_net

  # --------------------------------------------------------------------------
  # POSTGRES (Arroyo Metadata)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crypto_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # ARROYO (Streaming SQL Engine with Custom Worker)
  # --------------------------------------------------------------------------
  arroyo:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: arroyo
    image: torii/arroyo-worker:latest
    command: cluster
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      RUST_LOG: info
      # S3 / MinIO Configuration for FileSystem Sink
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
      # Force path style for MinIO
      AWS_S3_ADDRESSING_STYLE: path
      AWS_EC2_METADATA_DISABLED: "true"
    ports:
      - "${ARROYO_UI_PORT}:5115"
      - "${ARROYO_METRICS_PORT}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    volumes:
      # Persist cargo cache across rebuilds
      - cargo_cache:/root/.cargo/registry
    networks:
      - crypto_net

  # --------------------------------------------------------------------------
  # QUESTDB (Time-Series Database)
  # --------------------------------------------------------------------------
  questdb:
    image: questdb/questdb:latest
    container_name: questdb
    ports:
      - "${QUESTDB_UI_PORT}:9000"
      - "${QUESTDB_ILP_PORT}:9009"
      - "${QUESTDB_PG_PORT}:8812"
    environment:
      QDB_CAIRO_COMMIT_LAG: 1000
      QDB_CAIRO_MAX_UNCOMMITTED_ROWS: 1000
    volumes:
      - questdb_data:/root/.questdb
    networks:
      - crypto_net
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9000'" ]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1G
  # --------------------------------------------------------------------------
  # TORII INGESTION ENGINE
  # --------------------------------------------------------------------------
  torii-ingestion:
    build:
      context: ./torii_ingestion
      dockerfile: Dockerfile
    container_name: torii-ingestion
    image: torii/torii-ingestion:latest
    ports:
      - "9003:9003"
    environment:
      RUST_LOG: info
      # Config crate with prefix "APP" and separator "__"
      # APP_REDPANDA__BROKERS -> redpanda.brokers
      # APP_REDPANDA__TOPIC_PREFIX -> redpanda.topic_prefix
      APP_REDPANDA__BROKERS: "redpanda:9092"
      APP_REDPANDA__TOPIC_PREFIX: "market_data_raw"
    depends_on:
      redpanda:
        condition: service_healthy
      init-redpanda:
        condition: service_started
    networks:
      - crypto_net
    healthcheck:
      test: [ "CMD-SHELL", "pidof torii-ingestion-engine || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  # --------------------------------------------------------------------------
  # QUESTDB BRIDGE (Python Kafka -> QuestDB ILP)
  # --------------------------------------------------------------------------
  questdb-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    container_name: questdb-bridge
    image: torii/questdb-bridge:latest
    restart: always
    environment:
      KAFKA_BROKER: "redpanda:9092"
      QUESTDB_HOST: "questdb"
      QUESTDB_PORT: "9009"
      TOPIC: "market_data_raw"
    depends_on:
      redpanda:
        condition: service_healthy
      questdb:
        condition: service_healthy
    networks:
      - crypto_net
    deploy:
      resources:
        limits:
          memory: 512M

  # --------------------------------------------------------------------------
  # REDIS (Rate Limiting & Caching)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - crypto_net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # MINIO (S3-Compatible Storage)
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9090:9000" # S3 API
      - "9001:9001" # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - crypto_net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  # --------------------------------------------------------------------------
  # GRAFANA (Data Visualization)
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployment/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - crypto_net
    depends_on:
      questdb:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # PROMETHEUS (Metrics)
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9091:9090"
    networks:
      - crypto_net

  # --------------------------------------------------------------------------
  # TORII GATEWAY SERVICE
  # --------------------------------------------------------------------------
  torii-gateway:
    build:
      context: ./torii_gateway
      dockerfile: Dockerfile
    container_name: gateway
    image: torii/torii-gateway:latest
    ports:
      - "8080:8080"
      - "9002:9002"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: historical-data
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      PUBLIC_S3_ENDPOINT: ${PUBLIC_S3_ENDPOINT}
      QUESTDB_URL: http://questdb:9000
      QUESTDB_PG_URL: postgres://admin:quest@questdb:8812/qdb
      REDPANDA_BROKERS: redpanda:9092
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      questdb:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - crypto_net
    deploy:
      resources:
        limits:
          memory: 512M

  # --------------------------------------------------------------------------
  # DERIVATIVES WORKERS (Phase 13)
  # --------------------------------------------------------------------------
  liquidation-worker:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    container_name: liquidation-worker
    image: torii/liquidation-worker:latest
    command: [ "python3", "-u", "scripts/ingest_liquidations.py" ]
    restart: always
    environment:
      QUESTDB_HOST: "questdb"
    depends_on:
      questdb:
        condition: service_healthy
    networks:
      - crypto_net
    deploy:
      resources:
        limits:
          memory: 256M

  oi-worker:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    container_name: oi-worker
    image: torii/oi-worker:latest
    command: [ "python3", "-u", "scripts/ingest_open_interest.py" ]
    restart: always
    environment:
      QUESTDB_HOST: "questdb"
    depends_on:
      questdb:
        condition: service_healthy
    networks:
      - crypto_net
    deploy:
      resources:
        limits:
          memory: 256M

  retention-worker:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    container_name: retention-worker
    image: torii/retention-worker:latest
    command: [ "python3", "-u", "scripts/clean_old_data.py" ]
    restart: always
    environment:
      QUESTDB_HOST: "questdb"
    depends_on:
      questdb:
        condition: service_healthy
    networks:
      - crypto_net
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  redpanda_data:
  postgres_data:
  questdb_data:
  redis_data:
  minio_data:
  cargo_cache:
  grafana_data:
  prometheus_data:


networks:
  crypto_net:
    driver: bridge
