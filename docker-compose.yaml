version: "3.9"

services:
  # PostgreSQL - Arroyo metadata storage
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: arroyo
      POSTGRES_USER: arroyo
      POSTGRES_PASSWORD: arroyo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - arroyo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arroyo"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redpanda - Kafka-compatible message broker
  redpanda:
    image: redpandadata/redpanda:v23.3.1
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
    ports:
      - "18081:18081"  # Schema Registry
      - "18082:18082"  # Pandaproxy
      - "19092:19092"  # Kafka
      - "19644:9644"   # Admin API
    networks:
      - arroyo-net
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Arroyo - Single node cluster (all-in-one)
  arroyo:
    image: ghcr.io/arroyosystems/arroyo:latest
    container_name: arroyo
    command: cluster
    environment:
      DATABASE_URL: postgresql://arroyo:arroyo@postgres:5432/arroyo
      RUST_LOG: info
    ports:
      - "5115:5115"  # Web UI
      - "8001:8001"  # Prometheus metrics
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - arroyo-net


volumes:
  postgres_data:

networks:
  arroyo-net:
    driver: bridge
