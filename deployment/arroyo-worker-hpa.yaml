apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: arroyo-worker-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: arroyo-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arroyo-worker
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: arroyo-worker
  template:
    metadata:
      labels:
        app: arroyo-worker
    spec:
      containers:
      - name: worker
        image: arroyo/worker:latest
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        env:
        - name: ARROYO_WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "redpanda:9092"
