apiVersion: apps/v1
kind: Deployment
metadata:
  name: torii-gateway
  namespace: torii-production
  labels:
    app: torii-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: torii-gateway
  template:
    metadata:
      labels:
        app: torii-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9002"
    spec:
      containers:
      - name: gateway
        image: torii-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: ws
        - containerPort: 9002
          name: metrics
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: torii-secrets
              key: database-url
        - name: REDPANDA_BROKERS
          value: "redpanda-0.redpanda.torii-production.svc.cluster.local:9092,redpanda-1.redpanda.torii-production.svc.cluster.local:9092,redpanda-2.redpanda.torii-production.svc.cluster.local:9092"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: torii-gateway
  namespace: torii-production
spec:
  type: LoadBalancer
  selector:
    app: torii-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: ws
      port: 443 
      targetPort: 8081

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: torii-gateway-hpa
  namespace: torii-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: torii-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
