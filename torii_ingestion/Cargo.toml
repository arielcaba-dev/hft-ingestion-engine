[package]
name = "torii-ingestion-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "torii_ingestion_engine"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.28", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.4"
# For WebSocket connections
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
futures-util = "0.3" 
# For configuration
config = "0.13"
# For logging
log = "0.4"
env_logger = "0.10"
# For lock-free ring buffer (using crossbeam-queue as a foundation or manual implementation)
# For locking-free traits
async-trait = "0.1"
crossbeam = "0.8"

# For high-precision timing
chrono = { version = "0.4", features = ["serde"] }
bincode = "1.3"

# For Redpanda/Kafka (Pure Rust, Sync)
kafka = "0.10"

# Metrics
metrics = "0.21"
metrics-exporter-prometheus = "0.12"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "ring_buffer_bench"
harness = false

[[bench]]
name = "serialization_bench"
harness = false
